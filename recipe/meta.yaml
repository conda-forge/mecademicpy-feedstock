{% set name = "mecademicpy" %}
{% set version = "3.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mecademicpy-{{ version }}.tar.gz
  sha256: a6967a0519950b63bf1f9d117c6531cd2777cf1a1d7bcb92b561060c76768327

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - dataclasses-json >=0.5.4
    - deprecation
    - pandas
    - requests
    - pyyaml

test:
  imports:
    - mecademicpy
    - mecademicpy.robot
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://www.mecademic.com/support/
  dev_url: https://github.com/Mecademic/mecademicpy
  summary: A package to control the Mecademic robots through python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jjerphan
